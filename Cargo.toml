[workspace]
# `crates/*` is one level deep, so the browser-test runner nested inside
# `fofoca-iroh-webrtc-transport` needs naming explicitly — a package that is
# neither a member nor excluded is a hard cargo error. It lives in that crate
# rather than here because it drives that crate's tests and nothing else; being
# a member is only what shares `Cargo.lock`, `target/`, and the lint pass.
members = ["crates/*", "crates/fofoca-iroh-webrtc-transport/tasks"]
# Load-bearing on a *virtual* manifest: a root package on edition 2024 implies
# `resolver = "3"`, but a virtual workspace inherits nothing from its members
# and silently defaults to the edition-2015 `resolver = "1"`. Left implicit, the
# split from root-package to virtual would quietly change feature unification
# across the whole graph — notably folding the `test-fixtures` dev-dep feature
# into the shipped binary.
resolver = "3"

# Shared package fields. Each crate opts in with `edition.workspace = true`
# / `rust-version.workspace = true` / `version.workspace = true` so the
# workspace stays in lockstep on toolchain expectations and moves as one
# version. The crates are not independently versioned: they were carved out of
# a single engine to control the dependency closure per consumer, not to be
# released on separate cadences.
[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.5.0"

# Deps shared by the crates here, pinned once so versions stay in lockstep.
#
# The rule: **any dependency named by more than one crate is declared here and
# nowhere else.** A member opts in with `dep.workspace = true` and may union in
# extra features, but must not restate a version. Two crates asking for
# different versions of the same crate is not a style problem — for `iroh` and
# `iroh-base` it puts two copies in the graph, and the `CustomTransport` impls
# stop satisfying the trait iroh hands back (E0308), with an error message that
# points nowhere near the manifests that caused it.
#
# A dep only one crate names may stay in that crate; move it here the moment a
# second crate wants it.
#
# Feature sets here are the *floor*, not the union: where members disagree
# about `default-features`, the off position has to live here, because a member
# cannot turn off defaults the workspace turns on. `iroh` and `iroh-base` are
# both in that shape — see their entries.
[workspace.dependencies]
# A member again rather than a git dep: a separate repo bought nothing and cost
# a rev pin to bump on every change. It takes `iroh`/`iroh-base` from the
# workspace entries below like every other member, so it builds against the fork
# without naming it.
fofoca-iroh-multihop-transport = { path = "crates/fofoca-iroh-multihop-transport" }
# The *floor*, not the union: `rt-multi-thread`, `fs`, `signal`, `net` and
# `process` have no wasm32 equivalent, and `net` drags in `mio`, which refuses
# to build there at all. The engine adds them back under its `host` feature;
# anything that wants them unconditionally names them itself.
tokio = { version = "1", default-features = false, features = ["sync", "macros", "time", "rt"] }
serde = { version = "1", features = ["derive"] }
# `raw_value` lets the MCP `fetch_messages` result embed each event's
# already-rendered, field-order-pinned JSON verbatim (a `RawValue`) instead of
# re-parsing to a key-sorted `Value` — keeping MCP byte-identical to the
# `--output json` stream.
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
bytes = "1"
# Cargo-style colored status output for the operator-facing commands (`plug`,
# `unplug`, `doctor`). `anstream` resolves color support per stream at write
# time — a pipe, a file or `NO_COLOR` gets plain bytes — so an agent capturing
# stdout sees no ANSI without us branching on a flag or a TTY check.
anstyle = "1"
anstream = "0.6"
# `tracing` is already in the lockfile transitively (iroh depends on
# it); declaring it directly only lets us emit our own spans/events and
# adds nothing to the build. Pinned 0.1 (the only line; 0.x is stable).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
async-trait = "0.1.89"
uuid = { version = "1", features = ["v4"] }
# ── The iroh family: every one a direct git dep, and no patch table at all ───
#
# This block is the single source of truth for which iroh a consumer gets. A
# consumer of this workspace declares **nothing** from the iroh family and
# carries **no** `[patch.crates-io]`; it reaches iroh through `fofoca::iroh` and
# `fofoca_protocol::iroh_base`. That is the property to preserve when editing
# here — the moment a consumer has to restate a pin, it can drift, and a drifted
# pin is not an error: cargo silently resolves unpatched crates.io alongside the
# fork, and the two `iroh_base` crates surface as an E0308 nowhere near the
# manifest at fault.
#
# Why git rather than version + a patch: `[patch.crates-io]` redirects *someone
# else's* dependency edge, a plain dependency only redirects your own — and a
# patch is honoured solely in a workspace root and never inherited. So a fork
# lives on an edge exactly when no crate we do not control names it from
# crates.io. Nothing does any more: iroh's own `iroh-relay`/`iroh-dns` take
# theirs by path, and the two crates that did (`iroh-gossip`, both address
# lookups) are forked below purely to repoint their edges.
#
# `version` is kept alongside `git` so the requirement is still stated and still
# checked, and so each pin degrades to the published crate when its fix lands.
#
# `default-features = false` because the browser backend of the WebRTC transport
# cannot have them: iroh's defaults drag `tokio/net` -> `mio`, which refuses to
# build for wasm32. A member cannot turn off defaults the workspace turns on, so
# the off position lives here and the engine re-adds what it wants by name.
#
# Branch fix/netwatch-fork-pin: the mapped_addrs eviction (iroh#4294), the
# relay-teardown `join_next` drain, and netwatch/portmapper pinned to the
# net-tools fork so the RTM_MISS fix arrives transitively too.
iroh = { version = "=1.0.3", git = "https://github.com/fofoca-network/iroh", rev = "b7e07872a6d28a9b7971ecfaca8db69c4bddd2de", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
# The dependency-light half of iroh: keys, endpoint addresses, relay URLs — no
# QUIC, TLS or DNS. `fofoca-protocol` depends on this rather than `iroh` so the
# wire vocabulary carries no network stack (docs/mesh-slimming.md). Same repo and
# rev as `iroh` above, necessarily: the forked `iroh` uses its workspace-local
# copy, and mixing that with the published one is the two-`iroh_base` failure.
# `relay` is a default `fofoca-protocol` adds back; the transports do not need it.
iroh-base = { version = "=1.0.3", git = "https://github.com/fofoca-network/iroh", rev = "b7e07872a6d28a9b7971ecfaca8db69c4bddd2de", default-features = false, features = ["key"] }
# Only `iroh-mainline-address-lookup` names it, and only under `dht`. Pinned to
# the same rev for the same reason as `iroh-base`.
iroh-dns = { version = "=1.0.3", git = "https://github.com/fofoca-network/iroh", rev = "b7e07872a6d28a9b7971ecfaca8db69c4bddd2de" }
# The mDNS + mainline-DHT address-lookup providers, extracted from iroh core in
# the 1.0 line. Forked for one reason only: they sat between this crate and iroh
# and named iroh/iroh-base/iroh-dns from crates.io, which is what forced every
# consumer to carry a patch table. The fork holds no functional change and has no
# upstream path — n0 will not point their crates at ours — so delete it the
# moment the iroh pins themselves become unnecessary.
iroh-mdns-address-lookup = { version = "=0.4.0", git = "https://github.com/fofoca-network/iroh-address-lookups", rev = "53cf1ee6cc10a9b8c4805a5f7fe4d39570d86aa1" }
iroh-mainline-address-lookup = { version = "=0.4.0", git = "https://github.com/fofoca-network/iroh-address-lookups", rev = "53cf1ee6cc10a9b8c4805a5f7fe4d39570d86aa1" }
# `default-features = false` for the same reason as `iroh`: the browser leg
# cannot carry the host-only defaults.
#
# Branch fix/fofoca-iroh-pin: the connection-churn leak fix (upstream PR
# n0-computer/iroh-gossip#147) plus its own iroh/iroh-base repoint, since this
# crate is another that sat between us and iroh.
iroh-gossip = { version = "=0.101.0", git = "https://github.com/fofoca-network/iroh-gossip", rev = "57dcb6b8e5c0645c951830faf6b84b5893ee83c1", default-features = false, features = ["net"] }
# Named directly by both custom transports: `RecvMeta` appears in the
# `CustomEndpoint::poll_recv` signature. This is the quinn fork iroh runs on,
# and it resolves to the same crates.io release iroh itself depends on.
noq-udp = "=1.1.0"
# The portable clock. Off wasm32 this is `pub use std::time::*` and pulls in
# nothing, so on a host these *are* the std types; only a browser gets the
# `Performance.now()` / `Date.now()` implementation. Without it every
# `Instant::now()` / `SystemTime::now()` in the portable core panics on
# wasm32 — a runtime failure `cargo check` cannot see.
web-time = "1.1"
# Timers and task spawning, the other half of the portability story: `web-time`
# fixes `Instant`, but `tokio::time` still panics on wasm32 (no timer driver)
# and `tokio::spawn` needs a runtime nothing can `block_on` on a browser main
# thread. Off wasm32 it is a verbatim re-export of `tokio::{time, spawn}`.
n0-future = "0.3"
n0-watcher = "1.0"
# Shared by `fofoca-blobs` and the WebRTC transport's browser backend. Pinned
# here so the two cannot drift: `wasm-bindgen` and its generated glue must be
# one version across a module, or `wasm-bindgen` refuses to link them.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
bs58 = "0.5"
# The shared `state`/`meta` documents are automerge CRDTs: concurrent edits
# merge without a bespoke ordered-log fold. `default-features` stays on (the
# `storage-v2` on-disk format is unused — we carry changes on the wire).
automerge = "0.10"
sha2 = "0.10"
rand = "0.9"
libc = "0.2"
# Shared dev-deps (unit + integration tests, benches).
proptest = "1.6"
insta = "1"
divan = "0.1"

# Note: there is NO `rust_2021_idioms` group. `rust_2018_idioms` is the only
# idioms group and is still correct on edition 2021 (it bundles
# bare_trait_objects, elided_lifetimes_in_paths, explicit_outlives_requirements,
# unused_extern_crates, ellipsis_inclusive_range_patterns).
# `rust_2021_compatibility` is a migration-only group, not used here.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` not `forbid`: the engine carries a few documented libc FFI blocks,
# each with an `#[expect(unsafe_code, reason = ...)]`.
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
# Reject non-ASCII identifiers (homoglyph / supply-chain hardening;
# matches the project's ASCII-only protocol ethos).
non_ascii_idents = "deny"
# Require an explicit `unsafe {}` block inside any `unsafe fn`.
unsafe_op_in_unsafe_fn = "deny"
# NOTE: `unused_crate_dependencies` was evaluated and rejected — it is
# per-compilation-unit, so every `tests/*.rs` integration crate
# false-flags deps it doesn't personally use (anyhow/clap/bs58/...).
# Not fixable without per-test `use X as _;` source shims. The genuine
# dead deps it surfaced (`include_dir`, `schemars`) were removed below.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prevents holding a sync `std::sync::Mutex` (or RwLock) guard across an
# `.await` point — a recipe for deadlocks.
await_holding_lock = "deny"
# Cargo.toml hygiene (metadata, wildcard deps, feature names, ...).
cargo = { level = "warn", priority = -1 }
# cherry-picked restriction lints that aid readability
min_ident_chars = "warn"
shadow_unrelated = "warn"
semicolon_inside_block = "warn"
allow_attributes_without_reason = "warn"
excessive_nesting = "warn"
# Force `#[expect(...)]` over `#[allow(...)]` where the lint still fires, so a
# suppression that goes stale (lint no longer triggers) becomes a build error
# instead of silently lingering.
allow_attributes = "warn"
# Forbid `_ =>` catch-all arms on enum matches: a new variant must be
# handled explicitly rather than silently swallowed by a wildcard.
wildcard_enum_match_arm = "warn"
# documented opt-out (noise / not a readability win): keep CI signal useful
module_name_repetitions = "allow"
# Transitive duplicate crate versions are not controllable from a leaf
# binary (verified: ~16 dup crates, all pulled by iroh/reqwest/etc.);
# the lint is noise here, not an actionable signal.
multiple_crate_versions = "allow"

# Dependencies get light optimization in dev/test builds; workspace members
# stay at opt-level 0 (`package."*"` never applies to them) so incremental
# builds stay fast. Debug-built curve/AEAD/hash math is ~10x slower and
# inflates every connect/handshake in the subprocess test suite, so the hot
# crypto crates get full optimization. `ring` needs no entry (C/asm core).
[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3

# Two deliberate divergences from upstream here:
# - `lto = "thin"` / `codegen-units = 16` instead of fat LTO + 1 codegen unit:
#   upstream's fat LTO costs minutes per rebuild, which is too slow for the
#   mallorca dev loop.
# - NO `panic = "abort"`: fofoca-ffi's `ffi.rs` relies on
#   `catch_unwind` at the C ABI boundary so a Rust panic doesn't unwind past
#   `extern "C"` into the Odin host. `panic = "abort"` would kill the whole
#   mallorca process on any engine panic instead of returning an error code.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "debuginfo"

[profile.release.build-override]
opt-level = 3

# NOTE: there is deliberately **no `[patch.crates-io]` block** in this workspace,
# and no consumer of it has one either. Every fork rides a dependency edge
# instead -- see the iroh family in `[workspace.dependencies]` above for the rule
# and why each pin lives where it does. Re-introducing a patch here would mean
# every consumer had to restate it, since cargo honours a patch only in a
# workspace root and never inherits one.
