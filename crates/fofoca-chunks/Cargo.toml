[package]
name = "fofoca-chunks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "content-addressed chunks over data you already own: a merkle leaf row per file, and a store that never chooses where bytes live. Content addresses, not placement proofs — the replacement for the retired fofoca-blobs"
license = "MIT"
repository = "https://github.com/fofoca-network/fofoca"
readme = "README.md"
keywords = ["blake3", "content-addressed", "chunks", "p2p", "wasm"]
categories = ["network-programming", "encoding", "wasm"]
# Moved here from `agent-habilis/agent-share` (2026-08-30), where it was
# developed and named for this destination.
publish = false

[lints]
workspace = true

[lib]
name = "fofoca_chunks"
path = "src/lib.rs"

# **This crate must not depend on the network layer.** No `fofoca`, no
# `fofoca-protocol`, no `iroh`, and nothing from `agent-share`. It never sees a
# manifest, a ticket, a mesh, an ALPN or a share — it takes a hash, some bytes
# and a chunk map. That seam is what makes the crate movable, and
# `tests/isolation.rs` fails the build the moment someone adds the dependency
# that would make everything easier and the seam meaningless.
#
# Every dependency must also build for `wasm32-unknown-unknown`: the browser
# runs the same store a host does. `tokio`, anything with `fs`, and anything
# host-only belong behind a backend, not here.
[dependencies]
# The whole hashing story. No `bao-tree`: a content-addressed leaf is verified
# by hashing it and comparing to the key it was asked for, so there is no
# outboard to build, carry or decode. The workspace entry carries the
# `default-features = false` floor that keeps the wasm build honest; `std`
# comes back there for `std::io` and threading on the host.
blake3.workspace = true
anyhow.workspace = true

# Browser-only. Kept under a target cfg rather than a feature so a native build
# never sees `wasm-bindgen` at all, and `tests/isolation.rs` stays honest about
# what this crate pulls in on the host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
workspace = true
# IndexedDB is event-based rather than promise-based — it predates promises —
# which is why `IdbRequest` and `IdbTransaction` are named here at all: every
# call is an event pair that has to be adapted into a future.
features = [
  "IdbFactory",
  "IdbDatabase",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "DomException",
  # `object_store_names` is how `adopt` tells "this tab seeded here before" from
  # "opening just created an empty database", without provisioning storage for
  # somebody who is only browsing.
  "DomStringList",
]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = []
# Browsers have no native BLAKE3 — `crypto.subtle` does not offer it — so wasm
# is the only implementation and SIMD is the only lever. Pair with
# `-C target-feature=+simd128`; the flag is *assumed*, not detected, so a build
# without it produces a module that fails validation.
wasm-simd = ["blake3/wasm32_simd"]
