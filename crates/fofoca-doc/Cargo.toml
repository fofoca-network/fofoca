[package]
name = "fofoca-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "shared-state CRDT channels for fofoca (automerge)"
license = "MIT"
publish = false

[features]
default = ["host"]
# On by default. The parts that need an operating system. Turning it off leaves
# the portable half, which is what a browser needs and all it can have:
# `libc`, unix sockets, signals, processes and the filesystem have no wasm32
# equivalent. A wasm consumer builds the whole graph `--no-default-features`.
host = ["fofoca-protocol/host", "fofoca-util/host"]
# Exposes constructors the engine's adversarial suite injects with.
adversarial = []

[lints]
workspace = true

[lib]
name = "fofoca_doc"
path = "src/lib.rs"

[dependencies]
fofoca-protocol = { path = "../fofoca-protocol", default-features = false }
fofoca-util = { path = "../fofoca-util", default-features = false }
# The only crate in the workspace that names automerge. Swapping the CRDT for
# something cheaper (an LWW map is enough for a two-scalar transport doc) is a
# change to this crate alone. See docs/mesh-slimming.md.
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
bs58.workspace = true
zeroize = "1"
chacha20poly1305 = "0.10"

[dev-dependencies]
fofoca-protocol = { path = "../fofoca-protocol", default-features = false, features = ["test-fixtures"] }
proptest.workspace = true
insta.workspace = true
