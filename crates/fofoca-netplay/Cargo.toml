[package]
name = "fofoca-netplay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "GGPO-style rollback netcode for peer-to-peer games on a fofoca mesh"
license = "MIT"
publish = false

[features]
# Forwarded straight through to `fofoca`. On by default; turning it off leaves
# the portable half — no `host`, no IPC listener, no state file — which is how
# a browser peer builds the whole graph, and how the wasm32 CI job builds this.
default = ["host"]
host = ["fofoca/host"]

[lints]
workspace = true

[lib]
name = "fofoca_netplay"
path = "src/lib.rs"

[dependencies]
# The transport. This crate is rollback netcode *for a fofoca mesh* — peers
# find each other, connect and exchange frames through the engine's public
# embedding surface (`ops::send_app`, `embed::{EventLoopState, HandlerCtx}`,
# `protocol::{AppTag, MessageBody, Nickname}`). Like an app, it sits *above*
# the engine rather than beside it, unlike the strictly-downward
# `fofoca-protocol` / `fofoca-doc` / `fofoca-util`.
fofoca = { path = "../fofoca", default-features = false }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
# The wire format. JSON rather than a binary codec because `MessageBody`
# accepts only control-character-free UTF-8, which JSON satisfies by
# construction — a binary encoding would need base64 over the top.
serde_json.workspace = true
# `sync` only: the outbound mailbox is a `Node::sender()` channel. No
# runtime, no timers — wasm32 has no thread pool and needs neither.
tokio = { workspace = true, default-features = false, features = ["sync"] }

[dev-dependencies]
proptest.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The loopback integration test drives two real nodes, which needs a runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
