[package]
name = "light-cycles-native"
description = "the native light-cycles client: CLI, game logic, the fofoca + fofoca-netplay embedding, and terminal rendering via visage-rust-tui"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "light_cycles_native"
path = "src/lib.rs"

[[bin]]
name = "light-cycles"
path = "src/main.rs"

[dependencies]
# The full engine (native: control socket, mdns/dht discovery — a terminal
# is not a browser). Path dep, not the workspace's `crates/fofoca-netplay`
# pattern of depending on a sibling crate's default-features=false: this is
# a binary, not a portable library, so there's no wasm32 build of this
# crate to keep lean for.
fofoca.workspace = true
fofoca-netplay.workspace = true
visage-rust-tui = { path = "../visage-rust-tui" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
# A real dependency, not dev-only: `--log-file` is the only way to see what
# the engine is doing once the alternate screen owns the terminal, and
# without it a client that will not connect has no way to say why.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = "1"
