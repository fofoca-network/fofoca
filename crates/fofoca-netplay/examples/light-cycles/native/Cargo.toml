# A workspace of its own, deliberately — not a member of the repo's root
# workspace, and shares no crate with the `web/` half. See the plan's
# "Workspace layout": the game logic and the fofoca embedding are implemented
# independently on each side, on purpose.
[workspace]
members = ["game", "visage-rust-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.0"
publish = false

# The way back into the repo, stated once at this workspace's root rather than
# recounted from `game/`'s depth — same shape as the chat-webrtc example's.
[workspace.dependencies]
fofoca = { path = "../../../../fofoca" }
fofoca-netplay = { path = "../../.." }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
wildcard_enum_match_arm = "warn"
module_name_repetitions = "allow"
