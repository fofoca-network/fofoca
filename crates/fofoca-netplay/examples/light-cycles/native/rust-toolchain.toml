# `visage-rust-tui` uses native generators (`#![feature(coroutines,
# coroutine_trait)]`, the bare `yield` keyword) rather than a stable-Rust
# emulation crate — see its `component.rs`. That feature is nightly-only,
# and Cargo builds one workspace with one toolchain, so this pins the whole
# `native/` workspace (including `game`) to nightly, separately from the
# root repo's stable `rust-toolchain.toml`. Pinned to a specific date, not
# a rolling `nightly`, because unstable generator syntax has changed before
# (the `Generator`/`GeneratorState` names were renamed to `Coroutine`/
# `CoroutineState` in a past nightly) and a silent toolchain bump could
# break this workspace with no code change to point at.
[toolchain]
channel = "nightly-2026-06-05"
