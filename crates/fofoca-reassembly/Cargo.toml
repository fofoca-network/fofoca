[package]
name = "fofoca-reassembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "multipart body reassembly for fofoca"
license = "MIT"
publish = false

[features]
default = ["host"]
# On by default. The parts that need an operating system. Turning it off leaves
# the portable half, which is what a browser needs and all it can have:
# `libc`, unix sockets, signals, processes and the filesystem have no wasm32
# equivalent. A wasm consumer builds the whole graph `--no-default-features`.
host = ["fofoca-protocol/host", "fofoca-util/host"]
# Exposes constructors the engine's adversarial suite injects with.
adversarial = []

[lints]
workspace = true

[lib]
name = "fofoca_reassembly"
path = "src/lib.rs"

[dependencies]
fofoca-protocol = { path = "../fofoca-protocol", default-features = false }
fofoca-util = { path = "../fofoca-util", default-features = false }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true

[dev-dependencies]
fofoca-protocol = { path = "../fofoca-protocol", default-features = false, features = ["test-fixtures"] }
proptest.workspace = true
insta.workspace = true
