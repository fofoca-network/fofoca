[package]
name = "fofoca-pipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The portable byte-pipe embedding — the pipe_data/pipe_eof wire contract, its engine driver, and the join ritual every pipe peer shares"
publish = false

# No features, deliberately. The discovery legs (`mdns` / `dht`) gate *engine*
# dependencies, and this crate names none of them: it takes `fofoca` with
# defaults off and asks for nothing back, so cargo unifies whatever the consumer
# wants onto the one `fofoca` build. Restating them here would be a second knob
# that can disagree with `fofoca-ffi`'s, and would break the relay-only
# `--no-default-features` slimming that crate exists to allow.

[lints]
workspace = true

[lib]
name = "fofoca_pipe"
path = "src/lib.rs"

[dependencies]
# The engine, portable half. `default-features = false` because this crate must
# compile for wasm32: `host` drags in the IPC listener, the state file and
# `tokio/net` -> `mio`, which refuses to build there at all.
fofoca = { path = "../fofoca", default-features = false }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
# `sync` only: `mpsc` for the inbound and event queues, `oneshot` for the
# per-request replies. No `rt`, no `time` — wasm32 has no thread pool, and
# `tokio::time` has no driver there. The one sleep this crate does uses
# `n0-future` instead.
tokio = { workspace = true, default-features = false, features = ["sync"] }
# The portable timer, for the departure grace. Off wasm32 `n0_future::time` is a
# verbatim re-export of `tokio::time`, so the host path is byte-identical to
# what it was; in a browser `tokio::time::sleep` panics for want of a driver.
n0-future.workspace = true
# MessageBody is text-shaped (rejects control bytes), so a raw byte stream rides
# base64-encoded in the frame body. Crate-local rather than a workspace entry:
# this is the only crate that names it, and that is the point — the codec has one
# call site, so a browser and a terminal cannot disagree about padding.
base64 = "0.22"

# No `[dev-dependencies]`, and that is load-bearing rather than incidental. The
# workspace `tokio` dev-dep turns on `net` -> `mio`, and dev-deps are resolved
# for test targets on every target, so an unscoped one breaks
# `cargo check --target wasm32-unknown-unknown` before it reaches any code of
# ours (`crates/fofoca/Cargo.toml` carries the same scar). The tests here are
# pure arithmetic and derivation, needing nothing. The first one that wants a
# runtime goes under
# `[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]`.
