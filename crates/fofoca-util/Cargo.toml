[package]
name = "fofoca-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "host-level helpers for fofoca: runtime dirs, clock, tuning dials, bounded containers, build stamp"
license = "MIT"
publish = false

[features]
default = ["host"]
# On by default. The parts that need an operating system. Turning it off leaves
# the portable half, which is what a browser needs and all it can have:
# `libc`, unix sockets, signals, processes and the filesystem have no wasm32
# equivalent. A wasm consumer builds the whole graph `--no-default-features`.
#
# `async-io` rides along: `bounded_read` exists only for the engine's IPC
# listener, which is itself host-only.
host = ["dep:libc", "async-io"]
# Exposes helpers that exist only for assertions (clock::unix_nanos,
# Cooldown::len). fofoca turns it on through dev-dependencies.
test-fixtures = []
# `bounded_read` is the crate's only async code, and its only consumer is the
# engine's IPC listener. Gating it keeps tokio out of the wire crates
# (fofoca-protocol, -doc, -logging), which then have no async runtime at
# all. See docs/mesh-slimming.md.
# `tokio/io-util` is what carries `AsyncBufReadExt`, which `bounded_read` calls.
# Naming it here rather than relying on another crate to turn it on: without it
# `cargo check -p fofoca-protocol` fails, and the workspace build only worked
# because `fofoca` happens to request the feature and cargo unifies.
async-io = ["dep:tokio", "tokio/io-util"]

[lints]
workspace = true

[lib]
name = "fofoca_util"
path = "src/lib.rs"

# The bottom of the stack: no iroh, no serde, no engine modules. Everything
# here is either std, the two syscalls in `mesh_prefix`/`resident_memory`, or
# tokio's `AsyncBufRead` for `bounded_read`.
[dependencies]
libc = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing.workspace = true
web-time.workspace = true

# Stamps the build's git short hash + dirty flag into `version::VERSION`.
[build-dependencies]
vergen-gitcl = "1"
