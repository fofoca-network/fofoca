# A workspace of its own, deliberately — not a member of the repo's root
# workspace, even though it sits inside the crate it demonstrates.
#
# Two reasons, in order of how much they'd hurt:
#
# 1. Feature unification. `chat-native` wants
#    `fofoca-iroh-webrtc-transport/native`, and as a member that feature would
#    switch on for every `cargo build --workspace` in the parent repo, changing
#    what CI compiles for crates that never asked for it.
# 2. It makes the example an honest *consumer*. The parent workspace's
#    `Cargo.toml` documents a property worth proving rather than asserting: a
#    consumer of this transport restates no iroh version, no git rev, and
#    carries no `[patch.crates-io]`. Nothing below names iroh at all — it is
#    reached through `fofoca_iroh_webrtc_transport::iroh`. If that ever stops
#    being true, this workspace fails to build and says so.
#
# `rust-toolchain.toml` is *not* duplicated here: rustup walks up to the repo
# root and finds it. `.cargo/config.toml` is, because cargo does not — see the
# note in that file.
[workspace]
members = ["chat-proto", "chat-native"]
# wasm32-only: it names `web-sys`, which does not exist off the browser, and it
# is a cdylib. As a member, `--workspace` on a host would fail to build it, and
# feature unification would hand the transport crate *both* backends at once.
exclude = ["chat-web"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.0"
publish = false

[workspace.dependencies]
# The one dependency that matters. Everything iroh-shaped arrives through it:
# `fofoca_iroh_webrtc_transport::iroh` and `::iroh_base`. The backend feature is
# chosen per crate — `native` for the CLI, `web` for the wasm client — because a
# crate can only be one of those things.
fofoca-iroh-webrtc-transport = { path = "../.." }
chat-proto = { path = "chat-proto" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ticket encoding. Base58 rather than base64 so a ticket survives a
# double-click, a URL fragment and a copy out of a terminal without picking up
# `+`, `/` or `=`.
bs58 = { version = "0.5", features = ["check"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Example code is read more than it is run; a `_ =>` arm that silently swallows
# a new protocol message is exactly the bug a reader would not spot.
wildcard_enum_match_arm = "warn"
module_name_repetitions = "allow"
