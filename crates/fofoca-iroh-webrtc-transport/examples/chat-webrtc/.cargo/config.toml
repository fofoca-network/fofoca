# `getrandom` 0.3+ refuses to pick a wasm backend from a cargo feature alone —
# it also wants this cfg, and says so in a `compile_error!`. Without it every
# wasm32 build downstream of `rand` / `uuid` / `iroh-base` fails before it
# reaches our code.
#
# This is a copy of the repo root's `.cargo/config.toml`, and it has to be:
# cargo reads the config for the directory an invocation runs *from*, and this
# example is its own workspace. The root file says as much in its own comment —
# consider this the worked example of that instruction.
#
# Note it governs `chat-web` too even though that crate is excluded from the
# workspace above: config discovery walks the filesystem, not the member list.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']
