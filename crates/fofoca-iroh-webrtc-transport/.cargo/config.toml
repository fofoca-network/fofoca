# `cargo task <task>` from inside this crate.
#
# Cargo merges config from the invocation's directory upward, so this file
# applies when you are in the crate and is invisible from the workspace root —
# which is the point. The runner drives *this* crate's browser tests and
# nothing else, so it has no business on the workspace's surface.
#
# It merges with the repo root's `.cargo/config.toml`, which sets only
# `[target.wasm32-unknown-unknown] rustflags`; there is no key in common, and
# the wasm flag is still needed here because the tests this runs are wasm32.
[alias]
task = "run --package tasks --"
