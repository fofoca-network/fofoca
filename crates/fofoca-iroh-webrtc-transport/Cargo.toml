[package]
name = "fofoca-iroh-webrtc-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "An iroh custom transport carrying QUIC datagrams over a WebRTC data channel, on the host and in the browser"
license = "MIT"
repository = "https://github.com/fofoca-network/fofoca"
readme = "README.md"
keywords = ["iroh", "webrtc", "transport", "p2p", "wasm"]
categories = ["network-programming", "wasm"]
# Not published: it targets an unstable iroh API (`unstable-custom-transports`)
# behind a fork pin, so a crates.io release could not be built by anyone else.
publish = false

[lints]
workspace = true

[lib]
name = "fofoca_iroh_webrtc_transport"
path = "src/lib.rs"

# One crate, one protocol, two backends.
#
# The *protocol* half — the JSEP envelope, the transport id, the address
# convention — is always compiled and has no host- or browser-only dependency,
# so both backends and every consumer link the same bytes. The backends are
# mutually exclusive in practice and neither is on by default: a consumer picks
# the one matching its target.
#
# This layout is the point of the crate. In the experiment it was ported from,
# `SignalEnvelope` and `WEBRTC_TRANSPORT_ID` were written out twice — once per
# crate — under a comment asking the next reader to keep them in lockstep by
# hand. Two peers that disagree about either fail to connect with no useful
# error.
[features]
default = []
# Native backend: sans-io str0m driven by tokio, plus STUN candidate gathering.
native = [
    "dep:str0m",
    "dep:str0m-aws-lc-rs",
    "dep:tokio",
    "dep:if-addrs",
    "dep:rand",
    "dep:bytes",
    "dep:iroh",
    "dep:noq-udp",
    "dep:n0-watcher",
    "dep:serde_json",
]
# Browser backend: the platform's own RTCPeerConnection via web-sys.
web = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:futures",
    "dep:iroh",
    "dep:noq-udp",
    "dep:n0-watcher",
    "dep:serde_json",
]

[dependencies]
# ── protocol half: always compiled, wasm-clean ───────────────────────────
# `iroh-base` rather than `iroh`: an endpoint id and a CustomAddr need no
# endpoint, and this keeps the always-on surface buildable anywhere.
#
# Declared locally rather than taken from `[workspace.dependencies]`: the
# workspace entries do not set `default-features = false`, and dropping iroh's
# defaults is what keeps this crate buildable for wasm32.
#
# The `1.0.1` floor is deliberate and load-bearing. This crate is consumed both
# here, where the patch table supplies 1.0.2, and from `agent-habilis/agent-share`,
# where it supplies 1.0.1. A `1.0.2` requirement would be unsatisfiable there.
# Raise it only once both sides pin the same fork.
iroh-base = { version = "1.0.1", default-features = false, features = ["key"] }
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true

# ── shared by both backends ──────────────────────────────────────────────
# `unstable-custom-transports` gates the CustomTransport/CustomEndpoint/
# CustomSender traits both backends implement.
iroh = { version = "1.0.1", default-features = false, features = ["tls-ring", "unstable-custom-transports"], optional = true }
# `RecvMeta` appears in the `CustomEndpoint::poll_recv` signature.
noq-udp = { version = "1", optional = true }
n0-watcher = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

# ── native backend ───────────────────────────────────────────────────────
str0m = { version = "0.21", optional = true }
# DTLS crypto provider for str0m (sans-io WebRTC has no built-in default).
str0m-aws-lc-rs = { version = "0.5", optional = true }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util"], optional = true }
# Advertise a non-loopback host candidate when the ephemeral UDP socket binds
# 0.0.0.0 (vanilla ICE: candidates ride inside the SDP).
if-addrs = { version = "0.13", optional = true }
# Transaction ids for the STUN Binding Requests in `native::stun`.
rand = { version = "0.9", optional = true }
bytes = { version = "1", optional = true }

# ── browser backend ──────────────────────────────────────────────────────
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcDataChannelInit",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceGatheringState",
    "RtcIceConnectionState",
    "MessageEvent",
    "Event",
    "Window",
    "console",
    "Request",
    "RequestInit",
    "Response",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
n0-error = "1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The loopback test stands up two native endpoints, so it only exists under
# `native`. Declared rather than left implicit: `--all-targets` (what clippy and
# CI run) would otherwise try to build it with default features and fail on
# every host-only import.
[[test]]
name = "loopback"
required-features = ["native"]
