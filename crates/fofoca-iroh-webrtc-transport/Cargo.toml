[package]
name = "fofoca-iroh-webrtc-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "An iroh custom transport carrying QUIC datagrams over a WebRTC data channel, on the host and in the browser"
license = "MIT"
repository = "https://github.com/fofoca-network/fofoca"
readme = "README.md"
keywords = ["iroh", "webrtc", "transport", "p2p", "wasm"]
categories = ["network-programming", "wasm"]
# Not published: it targets an unstable iroh API (`unstable-custom-transports`)
# behind a fork pin, so a crates.io release could not be built by anyone else.
publish = false

[lints]
workspace = true

[lib]
name = "fofoca_iroh_webrtc_transport"
path = "src/lib.rs"

# One crate, one protocol, two backends.
#
# The *protocol* half — the JSEP envelope, the transport id, the address
# convention — is always compiled and has no host- or browser-only dependency,
# so both backends and every consumer link the same bytes. The backends are
# mutually exclusive in practice and neither is on by default: a consumer picks
# the one matching its target.
#
# This layout is the point of the crate. In the experiment it was ported from,
# `SignalEnvelope` and `WEBRTC_TRANSPORT_ID` were written out twice — once per
# crate — under a comment asking the next reader to keep them in lockstep by
# hand. Two peers that disagree about either fail to connect with no useful
# error.
[features]
default = []
# Native backend: sans-io str0m driven by tokio, plus STUN candidate gathering.
native = [
    "dep:str0m",
    "dep:str0m-aws-lc-rs",
    "dep:tokio",
    "dep:if-addrs",
    "dep:rand",
    "dep:bytes",
    "dep:iroh",
    "dep:noq-udp",
    "dep:n0-watcher",
]
# Browser backend: the platform's own RTCPeerConnection via web-sys.
web = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:futures",
    "dep:iroh",
    "dep:noq-udp",
    "dep:n0-watcher",
]

[dependencies]
# ── protocol half: always compiled, wasm-clean ───────────────────────────
# `iroh-base` rather than `iroh`: an endpoint id and a CustomAddr need no
# endpoint, and this keeps the always-on surface buildable anywhere. The
# workspace entry already carries `default-features = false` — iroh's defaults
# drag `tokio/net` -> `mio`, which refuses to build for wasm32, and the browser
# backend is the reason that off position lives at the workspace root.
iroh-base.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true

# ── shared by both backends ──────────────────────────────────────────────
# `unstable-custom-transports` gates the CustomTransport/CustomEndpoint/
# CustomSender traits both backends implement; the workspace entry turns it on.
iroh = { workspace = true, optional = true }
# `RecvMeta` appears in the `CustomEndpoint::poll_recv` signature.
noq-udp = { workspace = true, optional = true }
n0-watcher = { workspace = true, optional = true }

# ── native backend ───────────────────────────────────────────────────────
str0m = { version = "0.21", optional = true }
# DTLS crypto provider for str0m (sans-io WebRTC has no built-in default).
str0m-aws-lc-rs = { version = "0.5", optional = true }
tokio = { workspace = true, optional = true }
# Advertise a non-loopback host candidate when the ephemeral UDP socket binds
# 0.0.0.0 (vanilla ICE: candidates ride inside the SDP).
if-addrs = { version = "0.13", optional = true }
# Transaction ids for the STUN Binding Requests in `native::stun`.
rand = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

# ── browser backend ──────────────────────────────────────────────────────
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
web-sys = { workspace = true, optional = true, features = [
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcDataChannelInit",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceGatheringState",
    "RtcIceConnectionState",
    "MessageEvent",
    "Event",
    "Window",
    "console",
] }

[dev-dependencies]
tokio.workspace = true
n0-error = "1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The browser test's timers and its concurrent JSEP join. Already in the
# dependency closure via iroh on both targets; named here so the test target
# does not rely on that.
n0-future.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# DOM, for `browser_matrix.rs` to publish its results table and the
# `#matrix-done` marker that `cargo task e2e` waits on. Deliberately a *dev*
# dependency: the transport touches no document, and a feature added to the
# shipped `web-sys` entry would be on for every consumer that never asked.
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    # `Location`, so the sweep can read the CPU throttle the driver named in
    # the query string — a page cannot observe a throttle applied to it.
    "Location",
] }

# The loopback test stands up two native endpoints, so it only exists under
# `native`. Declared rather than left implicit: `--all-targets` (what clippy and
# CI run) would otherwise try to build it with default features and fail on
# every host-only import.
[[test]]
name = "loopback"
required-features = ["native"]

# Its browser twin, and the only coverage browser↔browser has. Same reason for
# being declared: `--all-targets` off wasm32 must not try to build it.
[[test]]
name = "browser_loopback"
required-features = ["web"]

# The configuration sweep the fast suite above is deliberately not: same
# harness, every traffic shape, minutes rather than seconds. Driven by
# `cargo task e2e`, which runs it once per browser / build profile /
# main-thread pressure level.
[[test]]
name = "browser_matrix"
required-features = ["web"]
