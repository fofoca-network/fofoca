[package]
name = "fofoca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "serverless gossip-network engine for agent-gossip"
license = "MIT"
publish = false

[lints]
workspace = true

[lib]
name = "fofoca"
path = "src/lib.rs"

[features]
# Off by default. Exposes the engine's cross-crate test fixtures (`Message`
# builders, `From<&str>` conveniences, etc.) — items otherwise `#[cfg(test)]`
# — so the app's test suites (which live in a separate crate now) can build
# them. The app enables it through its `[dev-dependencies]`, so it is on for
# `cargo test` and off for a normal/release build.
test-fixtures = ["fofoca-protocol/test-fixtures"]
# Off by default. Exposes the engine internals (crafted-message + state-doc
# constructors) the app's `harness::adversarial` shim reaches so the adversarial
# suite can inject malicious wire messages. Never enabled in a normal build.
adversarial = ["test-fixtures", "fofoca-protocol/adversarial", "fofoca-doc/adversarial", "fofoca-reassembly/adversarial"]
# Off by default. Gates out the daemon's `std::process::exit` on the quit path
# so the daemon returns cleanly and the app's dhat heap profiler (installed in
# `main`) can flush `dhat-heap.json`. The app's `dhat-heap` feature forwards to
# this one. Never in a normal build.
dhat-heap = []

# Discovery legs and the control socket, each gating its own dependency tree.
# `default` keeps a from-source build behaving exactly as before; an embedder
# that only needs relay-reachable meshes can turn them off and drop
# swarm-discovery/acto and n0-mainline/lru entirely. (`interprocess` still
# builds unconditionally: IpcMessage is in the event loop signatures, so
# gating it needs ipc.rs split by dependency first.) See
# docs/mesh-slimming.md in the mallorca repo.
default = ["mdns", "dht"]
mdns = ["dep:iroh-mdns-address-lookup"]
dht = ["dep:iroh-mainline-address-lookup"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
bytes.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true
# The workspace entry turns iroh's default features off, because the browser
# backend of the WebRTC transport cannot have them. The engine is the host peer
# and wants them, so it names them: `metrics`, `portmapper` and
# `fast-apple-datapath` are iroh's own defaults, and `unstable-net-report` is
# what 1.0.0 gated `Endpoint::net_report()` behind — the capability probe in
# `lookup::capability` reads the report directly.
iroh = { workspace = true, features = [
    "metrics",
    "portmapper",
    "fast-apple-datapath",
    "unstable-net-report",
] }
iroh-gossip.workspace = true
# The multi-hop iroh custom transport: reach a peer with no direct path by
# relaying its QUIC packets through intermediate peers. Registered on the
# peer endpoint (the `--multihop` flag).
iroh-multihop-transport.workspace = true
# Leaf crate: runtime dirs, clock, tuning dials, bounded containers, build stamp.
fofoca-util = { path = "../fofoca-util", features = ["async-io"] }
# Wire vocabulary: messages, mesh ids, nicknames, identity, sealing, invites.
fofoca-protocol = { path = "../fofoca-protocol" }
# Shared-state CRDT (owns automerge), the tracing sink (owns
# tracing-subscriber), multipart reassembly, and the directory ad codec.
fofoca-doc = { path = "../fofoca-doc" }
fofoca-logging = { path = "../fofoca-logging" }
fofoca-reassembly = { path = "../fofoca-reassembly" }
fofoca-directory = { path = "../fofoca-directory" }
bs58.workspace = true
sha2.workspace = true
rand.workspace = true
libc.workspace = true
# mDNS + mainline-DHT address-lookup providers were extracted from iroh core
# in the 1.0 line; these companion crates restore the `--mdns` / `--dht` legs.
iroh-mdns-address-lookup = { version = "0.4", optional = true }
iroh-mainline-address-lookup = { version = "0.4", optional = true }
# Argon2id password stretching for `--password` (mesh hash verifier + ticket
# handshake tokens). default-features off: no `password-hash` string format —
# we only need the raw `hash_password_into` KDF.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
futures-util = "0.3"
# End-to-end sealing of directed frames: a NaCl-style sealed box (ephemeral
# X25519 ECDH → ChaCha20-Poly1305) so only the addressed recipient can read a
# directed body. The AEAD key is derived from the ECDH secret via the in-tree
# `crypto::derive_secret` (SHA-256), so no HKDF dep. Both crates are pure-Rust
# (no `unsafe`, which the workspace denies).
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
# Best-effort wiping of retained secrets (the mesh password + derived channel
# keys) on drop, so they don't linger in process memory / core dumps.
zeroize = "1"
interprocess = { version = "2", features = ["tokio"] }

[dev-dependencies]
fofoca-util = { path = "../fofoca-util", features = ["test-fixtures", "async-io"] }
fofoca-protocol = { path = "../fofoca-protocol", features = ["test-fixtures"] }
proptest.workspace = true
insta.workspace = true
tokio.workspace = true
divan.workspace = true
