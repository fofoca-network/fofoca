[package]
name = "fofoca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "serverless gossip-network engine for agent-gossip"
license = "MIT"
publish = false

[lints]
workspace = true

[lib]
name = "fofoca"
path = "src/lib.rs"

[features]
# Off by default. Exposes the engine's cross-crate test fixtures (`Message`
# builders, `From<&str>` conveniences, etc.) — items otherwise `#[cfg(test)]`
# — so the app's test suites (which live in a separate crate now) can build
# them. The app enables it through its `[dev-dependencies]`, so it is on for
# `cargo test` and off for a normal/release build.
test-fixtures = ["fofoca-protocol/test-fixtures"]
# Off by default. Exposes the engine internals (crafted-message + state-doc
# constructors) the app's `harness::adversarial` shim reaches so the adversarial
# suite can inject malicious wire messages. Never enabled in a normal build.
adversarial = ["test-fixtures", "fofoca-protocol/adversarial", "fofoca-doc/adversarial", "fofoca-reassembly/adversarial"]
# Off by default. Gates out the daemon's `std::process::exit` on the quit path
# so the daemon returns cleanly and the app's dhat heap profiler (installed in
# `main`) can flush `dhat-heap.json`. The app's `dhat-heap` feature forwards to
# this one. Never in a normal build.
dhat-heap = []
# Off by default. Forwards iroh's own `test-utils` (`iroh::test_utils::
# run_relay_server` and friends) through our re-export.
#
# It exists because consumers no longer declare `iroh` themselves — they reach
# it through `fofoca::iroh` so there is exactly one iroh in the graph — and that
# leaves them no way to turn on one of iroh's optional features. A consumer that
# needs a real relay in a test enables this instead. Naming iroh directly to get
# the feature would put the published crate beside our fork, which is the whole
# failure this arrangement prevents.
#
# A dev-dependency feature on the consumer's side, so resolver 3 keeps it out of
# any shipped build.
iroh-test-utils = ["iroh/test-utils"]
# Off by default. The blob-offload side-channel: a `habilis-mesh/blob/1` ALPN
# server, a ticket, and fetch/offload, for handing a peer a payload too large to
# ride a gossip frame. `agent-gossip` enables it for A2A payload offload; the
# consumers that don't (mallorca, agent-share) pay neither the code size nor the
# spool directory.
#
# Implies `host`: it spools to disk and stands up its own iroh endpoint, and a
# browser has neither. Not to be confused with the `fofoca-blobs` crate — that
# is a verified-range *metadata store* with no transport, no ALPN and no
# framing, and the two are complements rather than alternatives.
blob = ["host"]

# Discovery legs and the control socket, each gating its own dependency tree.
# `default` keeps a from-source build behaving exactly as before; an embedder
# that only needs relay-reachable meshes can turn them off and drop
# swarm-discovery/acto and n0-mainline/lru entirely. (`interprocess` still
# builds unconditionally: IpcMessage is in the event loop signatures, so
# gating it needs ipc.rs split by dependency first.) See
# docs/mesh-slimming.md in the mallorca repo.
default = ["host", "mdns", "dht"]
# Both need real UDP sockets, so each implies `host`.
mdns = ["host", "dep:iroh-mdns-address-lookup"]
dht = ["host", "dep:iroh-mainline-address-lookup"]
# On by default, and the coarsest gate here: the parts of the engine that need
# an operating system. Turning it off leaves the portable engine — gossip, the
# CRDT documents, the protocol and identity types, address lookup — which is
# what a browser needs and all it can have. `interprocess`, `libc`, signals,
# processes and the filesystem have no wasm32 equivalent.
#
# It forwards to every leaf crate rather than gating only this one, because the
# split put the host-only code in six places. A wasm consumer builds the whole
# graph `--no-default-features`; CI does the same, or the browser target rots on
# the next edit that reaches for a file.
host = [
    "fofoca-util/host",
    "fofoca-protocol/host",
    "fofoca-doc/host",
    "fofoca-logging/host",
    "fofoca-reassembly/host",
    "fofoca-directory/host",
    "dep:fofoca-iroh-multihop-transport",
    "dep:interprocess",
    "dep:libc",
    # Base tokio is the portable floor (`sync`, `macros`, `time`, `rt`); these
    # are the pieces with no wasm32 equivalent. `net` in particular drags in
    # `mio`, which refuses to build for wasm32 at all.
    "tokio/rt-multi-thread",
    "tokio/fs",
    "tokio/signal",
    "tokio/net",
    "tokio/process",
    "tokio/io-util",
]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
bytes.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true
# The workspace entry turns iroh's default features off, because the browser
# backend of the WebRTC transport cannot have them. The engine is the host peer
# and wants them, so it names them: `metrics`, `portmapper` and
# `fast-apple-datapath` are iroh's own defaults, and `unstable-net-report` is
# what 1.0.0 gated `Endpoint::net_report()` behind — the capability probe in
# `lookup::capability` reads the report directly.
web-time.workspace = true
n0-future.workspace = true
# The multi-hop iroh custom transport: reach a peer with no direct path by
# relaying its QUIC packets through intermediate peers. Registered on the
# peer endpoint (the `--multihop` flag).
fofoca-iroh-multihop-transport = { workspace = true, optional = true }
# Leaf crate: runtime dirs, clock, tuning dials, bounded containers, build stamp.
fofoca-util = { path = "../fofoca-util", default-features = false, features = ["async-io"] }
# Wire vocabulary: messages, mesh ids, nicknames, identity, sealing, invites.
fofoca-protocol = { path = "../fofoca-protocol", default-features = false }
# Shared-state CRDT (owns automerge), the tracing sink (owns
# tracing-subscriber), multipart reassembly, and the directory ad codec.
fofoca-doc = { path = "../fofoca-doc", default-features = false }
fofoca-logging = { path = "../fofoca-logging", default-features = false }
fofoca-reassembly = { path = "../fofoca-reassembly", default-features = false }
fofoca-directory = { path = "../fofoca-directory", default-features = false }
bs58.workspace = true
sha2.workspace = true
rand.workspace = true
libc = { workspace = true, optional = true }
# mDNS + mainline-DHT address-lookup providers were extracted from iroh core
# in the 1.0 line; these companion crates restore the `--mdns` / `--dht` legs.
# From the workspace, because they are forked to pin iroh — see the iroh family
# block in the root manifest.
iroh-mdns-address-lookup = { workspace = true, optional = true }
iroh-mainline-address-lookup = { workspace = true, optional = true }
# Argon2id password stretching for `--password` (mesh hash verifier + ticket
# handshake tokens). default-features off: no `password-hash` string format —
# we only need the raw `hash_password_into` KDF.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
futures-util = "0.3"
# End-to-end sealing of directed frames: a NaCl-style sealed box (ephemeral
# X25519 ECDH → ChaCha20-Poly1305) so only the addressed recipient can read a
# directed body. The AEAD key is derived from the ECDH secret via the in-tree
# `crypto::derive_secret` (SHA-256), so no HKDF dep. Both crates are pure-Rust
# (no `unsafe`, which the workspace denies).
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
# Best-effort wiping of retained secrets (the mesh password + derived channel
# keys) on drop, so they don't linger in process memory / core dumps.
zeroize = "1"
interprocess = { version = "2", features = ["tokio"], optional = true }

[dev-dependencies]
fofoca-util = { path = "../fofoca-util", default-features = false, features = ["test-fixtures", "async-io"] }
fofoca-protocol = { path = "../fofoca-protocol", default-features = false, features = ["test-fixtures"] }

# The WebRTC lane is not optional: it is the browser's only way onto the mesh.
# Only the backend differs by target — str0m natively, the platform's own
# RTCPeerConnection in a tab — and `WebRtcHandle` is the same type either way,
# so the wiring in `lookup` is written once.
#
# Split by target rather than by our own `host` feature, because which backend
# compiles is a property of the target: a `--no-default-features` *native*
# build still wants str0m, not the browser hub.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fofoca-iroh-webrtc-transport = { path = "../fofoca-iroh-webrtc-transport", features = ["native"] }
# iroh's own defaults, re-added by name because the workspace entry turns them
# off for the browser's sake. `unstable-net-report` is what 1.0.0 gated
# `Endpoint::net_report()` behind; `lookup::capability` reads the report.
iroh = { workspace = true, features = [
    "metrics",
    "portmapper",
    "fast-apple-datapath",
    "unstable-net-report",
] }
iroh-gossip.workspace = true

# The browser needs the endpoint and the relay transport and nothing else:
# iroh's defaults (portmapper, fast-apple-datapath, metrics) are host-only and
# drag `tokio/net` -> `mio`, which refuses to build for wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fofoca-iroh-webrtc-transport = { path = "../fofoca-iroh-webrtc-transport", features = ["web"] }
iroh.workspace = true
iroh-gossip.workspace = true

# Scoped to non-wasm on purpose. The workspace `tokio` dev-dep turns on `net`,
# which drags in `mio` — and dev-dependencies are resolved for test targets too,
# so leaving these unscoped makes `cargo check --target wasm32-unknown-unknown`
# fail before it reaches any code of ours.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true
insta.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
divan.workspace = true
# The `mesh_peer` example installs its own subscriber. The engine takes
# tracing-subscriber only through `fofoca-logging`, and only under `host`.
tracing-subscriber.workspace = true

# The wasm test harness. Only a browser/node target runs it, and only
# `tests/wasm_runtime.rs` uses it — see that file for why it has to exist.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# `mesh_peer` is a two-peer smoke run against a real relay: it needs the host
# runtime, so it is not built by a portable check.
[[example]]
name = "mesh_peer"
required-features = ["host"]
