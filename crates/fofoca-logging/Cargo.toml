[package]
name = "fofoca-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "tracing sink and directive filter for fofoca"
license = "MIT"
publish = false

[features]
# Exposes constructors the engine's adversarial suite injects with.
adversarial = []

[lints]
workspace = true

[lib]
name = "fofoca_logging"
path = "src/lib.rs"

[dependencies]
fofoca-protocol = { path = "../fofoca-protocol" }
fofoca-util = { path = "../fofoca-util" }
# The only crate that names tracing-subscriber, which drags in the regex engine
# behind EnvFilter (~0.7 MiB of __text). See docs/mesh-slimming.md.
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
fofoca-protocol = { path = "../fofoca-protocol", features = ["test-fixtures"] }
proptest.workspace = true
insta.workspace = true
