[package]
name = "fofoca-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "tracing sink and directive filter for fofoca"
license = "MIT"
publish = false

[features]
default = ["host"]
# On by default. The parts that need an operating system. Turning it off leaves
# the portable half, which is what a browser needs and all it can have:
# `libc`, unix sockets, signals, processes and the filesystem have no wasm32
# equivalent. A wasm consumer builds the whole graph `--no-default-features`.
host = ["fofoca-protocol/host", "fofoca-util/host", "dep:tracing-subscriber"]
# Exposes constructors the engine's adversarial suite injects with.
adversarial = []

[lints]
workspace = true

[lib]
name = "fofoca_logging"
path = "src/lib.rs"

[dependencies]
fofoca-protocol = { path = "../fofoca-protocol", default-features = false }
fofoca-util = { path = "../fofoca-util", default-features = false }
# The only crate that names tracing-subscriber, which drags in the regex engine
# behind EnvFilter (~0.7 MiB of __text). See docs/mesh-slimming.md.
tracing.workspace = true
# The file sink only exists on a host; a browser logs to the console.
tracing-subscriber = { workspace = true, optional = true }
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
fofoca-protocol = { path = "../fofoca-protocol", default-features = false, features = ["test-fixtures"] }
proptest.workspace = true
insta.workspace = true
