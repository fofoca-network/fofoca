[package]
name = "fofoca-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A C-ABI shim over the fofoca engine — lets a non-Rust process join a gossip mesh in-process"
publish = false

[features]
# Forwarded from the engine so an embedder can drop the discovery legs it does
# not use. `default` matches the engine's, so a plain build is unchanged; a
# relay-only embedder builds with --no-default-features and sheds
# swarm-discovery/acto and n0-mainline/lru. See docs/mesh-slimming.md.
default = ["mdns", "dht"]
mdns = ["fofoca/mdns"]
dht = ["fofoca/dht"]

[lints]
workspace = true

[lib]
name = "fofoca_ffi"
path = "src/lib.rs"
# `cdylib` is the artifact C links against (libfofoca_ffi.dylib /
# .so); `rlib` is what `tests/ffi_smoke.rs` links, so the C ABI is exercised from
# Rust on a host with no C compiler. `staticlib` is what mallorca links against
# (a stable .a path, decoupled from the cdylib's dynamic-loader requirements).
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# The ONLY mesh dependency — this crate never touches agent-gossip / a2a, the
# same constraint examples/mesh-pipe holds itself to.
fofoca = { path = "../fofoca", default-features = false }
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Mirrors examples/mesh-pipe: MessageBody is text-shaped (rejects control
# bytes), so a raw byte stream rides base64-encoded in the frame body.
base64 = "0.22"
