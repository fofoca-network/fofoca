[package]
name = "fofoca-stream-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "`fofoca-stream`: stdin to one reader over a direct path, or a stream's bytes to stdout"
readme = "README.md"
publish = false

# A sibling of `fofoca-stream` rather than a `[[bin]]` inside it: the wasm gate
# builds that crate for wasm32, and a binary needs the tokio runtime that
# cannot go there. Same shape as `fofoca-ffi`, the other host-only consumer.

[features]
default = ["mdns", "dht"]
mdns = ["fofoca/mdns"]
dht = ["fofoca/dht"]

[lints]
workspace = true

[[bin]]
name = "fofoca-stream"
path = "src/main.rs"

[dependencies]
fofoca = { path = "../fofoca", default-features = false }
fofoca-stream = { path = "../fofoca-stream" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
tracing-subscriber.workspace = true
