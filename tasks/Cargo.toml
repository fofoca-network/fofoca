[package]
name = "tasks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# A task runner, not a library anyone depends on. It is a workspace member so
# it shares `Cargo.lock` and `target/` (and so the workspace lint pass covers
# it), not because it ships anywhere.
publish = false

[dependencies]
# Mirrors the sibling repos' task runners: clap derive for the CLI, xshell for
# the commands that are a single foreground call. Anything whose child has to
# outlive the call — the harness server, the drivers — uses
# `std::process::Command` directly so it can be killed on drop.
clap = { version = "4", features = ["derive"] }
xshell = "0.2"
# Cargo's `--message-format=json` for artifact discovery, and the WebDriver
# wire format. Both already in `Cargo.lock` via the workspace entries.
serde = { workspace = true }
serde_json = { workspace = true }
# The W3C WebDriver client. `default-features = false` deliberately: every
# request this makes is plain HTTP to 127.0.0.1, so the default TLS stack would
# be pure compile time for a connection that never happens. `json` is the one
# feature kept — it is `send_json`/`read_json`, and hand-rolling those against
# `serde_json` was most of what made the original `curl | jq` runner painful.
ureq = { version = "3", default-features = false, features = ["json"] }
# Cargo-style status output, so a long sweep reads like the cargo invocations
# around it rather than like a shell script.
anstyle = "1"
anstream = "0.6"
# The `mesh` feature's deps: the mesh and chat suites run a real native peer
# in-process and a local relay, so the runner depends on the engine it drives.
fofoca = { path = "../crates/fofoca", features = ["iroh-test-utils"], optional = true }
fofoca-pipe = { path = "../crates/fofoca-pipe", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"], optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
# The mesh and chat e2e suites need the engine and its test relay. Off by
# default so a plain `--workspace` build does not unify `iroh-test-utils`
# into `fofoca` (`tasks` is a workspace member, and cargo takes the union of
# every selected package's features); `cargo task e2e --suite mesh|chat`
# re-runs itself with this on.
mesh = ["dep:fofoca", "dep:fofoca-pipe", "dep:tokio", "dep:tracing-subscriber"]

[lints]
workspace = true
