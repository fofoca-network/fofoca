[package]
name = "chat-proto"
description = "Wire vocabulary shared by the native and browser chat peers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `default-features = false` and no backend feature: this crate wants only the
# always-compiled protocol half, for `iroh_base::{EndpointId, RelayUrl}`. It
# must build for wasm32 and for the host from the same source, so it may not
# reach `iroh` proper — that would drag in a QUIC stack the browser cannot have.
fofoca-iroh-webrtc-transport.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bs58.workspace = true
