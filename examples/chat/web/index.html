<!doctype html>
<!--
  The chat example's page. A person opens it and chats; the e2e driver reads
  the same DOM a person does — see src/chat.ts for the query parameters and
  the contract.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fofoca chat</title>
    <style>
      body {
        font: 14px/1.5 ui-monospace, monospace;
        margin: 0;
        display: grid;
        grid-template-columns: 1fr 16rem;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }
      header { grid-column: 1 / 3; padding: 0.5rem 1rem; border-bottom: 1px solid #ddd; display: flex; gap: 1rem; align-items: baseline; }
      h1 { font-size: 1rem; margin: 0; }
      #status { color: #666; }
      #messages { list-style: none; margin: 0; padding: 1rem; overflow-y: auto; }
      #messages li { margin-bottom: 0.25rem; word-break: break-word; }
      #messages li::before { content: attr(data-from) ': '; font-weight: bold; }
      #messages li[data-directed='true'] { color: #7326d3; }
      #messages li[data-self='true'] { color: #666; }
      aside { border-left: 1px solid #ddd; padding: 1rem; overflow-y: auto; }
      h2 { font-size: 0.9rem; margin: 0 0 0.5rem; }
      #peers { white-space: pre-wrap; word-break: break-all; font-size: 12px; }
      #composer { grid-column: 1 / 3; display: flex; border-top: 1px solid #ddd; }
      #input { flex: 1; font: inherit; border: 0; padding: 0.75rem 1rem; outline: none; }
      button { font: inherit; border: 0; background: #7326d3; color: white; padding: 0 1.5rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <header><h1>fofoca chat</h1><div id="status">opening…</div></header>
    <ul id="messages"></ul>
    <aside>
      <h2>peers</h2>
      <pre id="peers" data-count="0">[]</pre>
    </aside>
    <form id="composer">
      <input id="input" autocomplete="off" placeholder="message…  (/msg <nick> <text> for a direct message)" />
      <button type="submit">send</button>
    </form>
    <ul id="events" hidden></ul>
    <script type="module" src="./chat.js"></script>
  </body>
</html>
