# `getrandom` 0.3+ will not pick a wasm backend from a cargo feature alone — it
# also requires this cfg, and says so in a compile_error. Without it every
# wasm32 build of anything downstream of `rand`/`uuid`/`iroh-base` fails before
# it reaches our code.
#
# A consumer building fofoca for wasm32 from its own workspace needs the same
# line in its own `.cargo/config.toml`: this file governs cargo invocations run
# from inside this directory, not the crates themselves.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']

# `cargo task <task>` — the quality gate and the browser sweep, runnable
# without transcribing `.github/workflows/ci.yml`.
#
# Cargo reads every `.cargo/config.toml` from the invocation's directory up to
# the filesystem root, so this one alias reaches every crate in the workspace.
# There is deliberately no per-crate copy: a crate-local file defining the same
# key would shadow this one, and `cargo task` would mean something different
# depending on where you stood. Scope with `-p <crate>` instead.
[alias]
task = "run --package tasks --"
