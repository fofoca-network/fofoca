name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Reads rust-toolchain.toml — do not duplicate the version here.
      # The extra target is for `fofoca-blobs`, whose OPFS and IndexedDB
      # backends only exist on wasm32 and would otherwise compile nowhere.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `blob` is off by default (only agent-gossip enables it), so the line
      # above never lints `src/blob/` — ~1,300 lines including its own ALPN
      # server. `--all-features` below only *checks* it.
      - name: Clippy (blob)
        run: cargo clippy -p fofoca --features blob --all-targets -- -D warnings

      # A doc link that does not resolve is the same drift as a stale comment,
      # and nothing else here would catch it: 25 had accumulated, including a
      # method renamed out from under its own docs.
      - name: Doc links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps --all-features

      - name: Check
        run: cargo check --workspace --all-targets

      # The `mdns` and `dht` features exist so a consumer can drop iroh's
      # discovery closure, and `async-io` so `fofoca-util` can shed tokio.
      # Nothing else proves those combinations still compile.
      - name: Check (no default features)
        run: cargo check --workspace --no-default-features

      - name: Check (all features)
        run: cargo check --workspace --all-features

      # `fofoca-iroh-webrtc-transport` compiles one of two mutually exclusive
      # backends and neither is on by default, so the steps above — which all
      # run with default features — build neither. `native` is the str0m one,
      # and it owns the loopback test.
      - name: Check (webrtc, native backend)
        run: cargo check -p fofoca-iroh-webrtc-transport --features native --all-targets

      - name: Clippy (webrtc, native backend)
        run: cargo clippy -p fofoca-iroh-webrtc-transport --features native --all-targets -- -D warnings

      # Two crates are reachable on wasm32 and nowhere else, and between them
      # that is a substantial amount of code no other job compiles: roughly a
      # third of `fofoca-blobs` (`src/opfs.rs`, `src/idb.rs`,
      # `tests/opfs_browser.rs`) and the whole `web` backend of the WebRTC
      # transport. Without these steps that code rots silently, and the
      # `#[expect(...)]` attributes inside it are never lint-checked either.
      #
      # Clippy, not just check. The `web` backend had never been linted before
      # this job existed and carried 18 findings on its first pass.
      #
      # Nothing else in the workspace builds for wasm32, hence `-p`. No
      # rustflags and no C toolchain are needed: neither crate pulls
      # `getrandom` or a C dependency.
      - name: Check (wasm32)
        run: |
          cargo check --target wasm32-unknown-unknown -p fofoca-blobs --all-targets
          cargo check --target wasm32-unknown-unknown -p fofoca-iroh-webrtc-transport --features web
          # The engine itself must reach the browser, not merely be avoidable
          # from it. `--no-default-features` is the portable half: no `host`,
          # so no IPC listener, no state file, no process helpers. Without this
          # gate the wasm target rots on the next edit that reaches for a file
          # or a socket.
          #
          # Not `--all-targets`: the unit tests pull proptest and insta, which
          # are host-only dev-deps. The one wasm test target is named below.
          cargo check --target wasm32-unknown-unknown -p fofoca --no-default-features
          cargo check --target wasm32-unknown-unknown -p fofoca --no-default-features --test wasm_runtime

      - name: Clippy (wasm32)
        run: |
          cargo clippy --target wasm32-unknown-unknown -p fofoca-blobs --all-targets -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p fofoca-iroh-webrtc-transport --features web -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p fofoca --no-default-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Not covered by `--workspace` above: `blob` is off by default, so its
      # ticket round-trips and the loopback offload→fetch test never run there.
      - name: Test (blob)
        run: cargo test -p fofoca --features blob

      # Not covered by `--workspace` above: the loopback suite is behind
      # `required-features = ["native"]`, so a default-feature test run skips
      # it. It stands up two real endpoints and completes a QUIC handshake over
      # a str0m data channel, offline via `IceConfig::host_only()`.
      - name: Test (webrtc, native backend)
        run: cargo test -p fofoca-iroh-webrtc-transport --features native

  # The C ABI is the whole point of fofoca-ffi and its only non-Rust consumer
  # links the staticlib. Build it the way that consumer does.
  staticlib:
    name: FFI staticlib
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2

      - name: Build staticlib
        run: cargo build --release -p fofoca-ffi

      - name: Confirm the archive exists and exports the ABI
        run: |
          ls -lh target/release/libfofoca_ffi.a
          # Every function declared in include/fofoca.h must be present in the
          # archive, or a downstream link fails long after this job went green.
          nm -gU target/release/libfofoca_ffi.a 2>/dev/null \
            | grep -oE '_fofoca_[a-z_]+$' | sort -u > /tmp/exported.txt
          grep -oE '\bfofoca_[a-z_]+(?=\()' -P crates/fofoca-ffi/include/fofoca.h \
            | sort -u | sed 's/^/_/' > /tmp/declared.txt
          echo "--- declared in fofoca.h ---"; cat /tmp/declared.txt
          missing=$(comm -23 /tmp/declared.txt /tmp/exported.txt)
          if [ -n "$missing" ]; then
            echo "::error::declared in fofoca.h but not exported by the staticlib:"
            echo "$missing"
            exit 1
          fi
