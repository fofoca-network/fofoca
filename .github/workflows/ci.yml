name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Reads rust-toolchain.toml — do not duplicate the version here.
      # The extra target is for `fofoca-blobs`, whose OPFS and IndexedDB
      # backends only exist on wasm32 and would otherwise compile nowhere.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `blob` is off by default (only agent-gossip enables it), so the line
      # above never lints `src/blob/` — ~1,300 lines including its own ALPN
      # server. `--all-features` below only *checks* it.
      - name: Clippy (blob)
        run: cargo clippy -p fofoca --features blob --all-targets -- -D warnings

      # A doc link that does not resolve is the same drift as a stale comment,
      # and nothing else here would catch it: 25 had accumulated, including a
      # method renamed out from under its own docs.
      - name: Doc links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps --all-features

      - name: Check
        run: cargo check --workspace --all-targets

      # The `mdns` and `dht` features exist so a consumer can drop iroh's
      # discovery closure, and `async-io` so `fofoca-util` can shed tokio.
      # Nothing else proves those combinations still compile.
      - name: Check (no default features)
        run: cargo check --workspace --no-default-features

      - name: Check (all features)
        run: cargo check --workspace --all-features

      # `fofoca-iroh-webrtc-transport` compiles one of two mutually exclusive
      # backends and neither is on by default, so the steps above — which all
      # run with default features — build neither. `native` is the str0m one,
      # and it owns the loopback test.
      - name: Check (webrtc, native backend)
        run: cargo check -p fofoca-iroh-webrtc-transport --features native --all-targets

      - name: Clippy (webrtc, native backend)
        run: cargo clippy -p fofoca-iroh-webrtc-transport --features native --all-targets -- -D warnings

      # Five crates are reachable on wasm32 and nowhere else, and between them
      # that is a substantial amount of code no other job compiles: roughly a
      # third of `fofoca-blobs` (`src/opfs.rs`, `src/idb.rs`,
      # `tests/opfs_browser.rs`), the whole `web` backend of the WebRTC
      # transport, the portable half of the engine, `fofoca-netplay`'s
      # simulation, and `fofoca-pipe`'s wire contract. Without these steps that
      # code rots silently, and the `#[expect(...)]` attributes inside it are
      # never lint-checked either.
      #
      # Clippy, not just check. The `web` backend had never been linted before
      # this job existed and carried 18 findings on its first pass.
      #
      # Only these crates build for wasm32, hence `-p` throughout. No
      # rustflags and no C toolchain are needed: none of them pulls
      # `getrandom` or a C dependency.
      - name: Check (wasm32)
        run: |
          cargo check --target wasm32-unknown-unknown -p fofoca-blobs --all-targets
          cargo check --target wasm32-unknown-unknown -p fofoca-iroh-webrtc-transport --features web
          # The engine itself must reach the browser, not merely be avoidable
          # from it. `--no-default-features` is the portable half: no `host`,
          # so no IPC listener, no state file, no process helpers. Without this
          # gate the wasm target rots on the next edit that reaches for a file
          # or a socket.
          #
          # Not `--all-targets`: the unit tests pull proptest and insta, which
          # are host-only dev-deps. The one wasm test target is named below.
          cargo check --target wasm32-unknown-unknown -p fofoca --no-default-features
          cargo check --target wasm32-unknown-unknown -p fofoca --no-default-features --test wasm_runtime
          # fofoca-netplay sits above the engine (rollback netcode for
          # peer-to-peer games, not part of it), but must be just as
          # portable: a browser peer is exactly who needs it, and a match
          # between a browser and a terminal only works if both run a
          # bit-identical simulation.
          cargo check --target wasm32-unknown-unknown -p fofoca-netplay --no-default-features
          # fofoca-pipe is the wire contract a browser tab and a terminal
          # share. If it stops compiling here the browser package cannot be
          # built at all, and that package is its own cargo workspace — so
          # this is the only place the breakage is caught from inside the
          # workspace.
          cargo check --target wasm32-unknown-unknown -p fofoca-pipe

      - name: Clippy (wasm32)
        run: |
          cargo clippy --target wasm32-unknown-unknown -p fofoca-blobs --all-targets -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p fofoca-iroh-webrtc-transport --features web -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p fofoca --no-default-features -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p fofoca-netplay --no-default-features -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p fofoca-pipe -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Not covered by `--workspace` above: `blob` is off by default, so its
      # ticket round-trips and the loopback offload→fetch test never run there.
      - name: Test (blob)
        run: cargo test -p fofoca --features blob

      # Not covered by `--workspace` above: the loopback suite is behind
      # `required-features = ["native"]`, so a default-feature test run skips
      # it. It stands up two real endpoints and completes a QUIC handshake over
      # a str0m data channel, offline via `IceConfig::host_only()`.
      - name: Test (webrtc, native backend)
        run: cargo test -p fofoca-iroh-webrtc-transport --features native

  # The C ABI is the whole point of fofoca-ffi and its only non-Rust consumer
  # links the staticlib. Build it the way that consumer does.
  staticlib:
    name: FFI staticlib
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2

      - name: Build staticlib
        run: cargo build --release -p fofoca-ffi

      - name: Confirm the archive exists and exports the ABI
        run: |
          ls -lh target/release/libfofoca_ffi.a
          # Every function declared in include/fofoca.h must be present in the
          # archive, or a downstream link fails long after this job went green.
          nm -gU target/release/libfofoca_ffi.a 2>/dev/null \
            | grep -oE '_fofoca_[a-z_]+$' | sort -u > /tmp/exported.txt
          grep -oE '\bfofoca_[a-z_]+(?=\()' -P crates/fofoca-ffi/include/fofoca.h \
            | sort -u | sed 's/^/_/' > /tmp/declared.txt
          echo "--- declared in fofoca.h ---"; cat /tmp/declared.txt
          missing=$(comm -23 /tmp/declared.txt /tmp/exported.txt)
          if [ -n "$missing" ]; then
            echo "::error::declared in fofoca.h but not exported by the staticlib:"
            echo "$missing"
            exit 1
          fi

  # `crates/fofoca-netplay/examples/light-cycles/native/` is its own cargo
  # workspace (a separate `rust-toolchain.toml` pins it to nightly —
  # `visage-rust-tui` uses native generators, a nightly-only feature — so it
  # can't join the root `check` job's stable toolchain). Not covered by anything
  # above; the root CI doesn't touch `chat-webrtc` either, so this is the first
  # example to get its own job, not a gap being left open.
  light-cycles-native:
    name: light-cycles (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/fofoca-netplay/examples/light-cycles/native

    steps:
      - uses: actions/checkout@v6

      # `rust-src-dir` is what makes this read *this workspace's*
      # rust-toolchain.toml (nightly, for `visage-rust-tui`'s generators)
      # rather than the repo root's — the action cds into it before looking
      # for the file, and hard-fails if the path is gone. So the version
      # still lives in exactly one place, same as the root `check` job.
      # It also drives the action's embedded rust-cache (`workspaces`
      # defaults to it), which is why there is no separate cache step here.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: crates/fofoca-netplay/examples/light-cycles/native
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes `game/tests/two_bots.rs` — two headless bots on a
      # loopback-only mesh, no internet, converging purely from exchanged
      # `lc_turn` inputs. See the plan's "Verification plan" #6.
      - name: Test
        run: cargo test --workspace

  # `crates/fofoca-netplay/examples/light-cycles/web/wasm/` is its own cargo
  # workspace (an empty `[workspace]` table, same trick chat-web uses —
  # `web-sys` doesn't exist off wasm32). Root toolchain applies (no nightly
  # features here), unlike the native example above.
  light-cycles-web:
    name: light-cycles (web)
    runs-on: ubuntu-latest
    # The wasm crate, not `web/` — most steps below are cargo invocations.
    defaults:
      run:
        working-directory: crates/fofoca-netplay/examples/light-cycles/web/wasm

    steps:
      - uses: actions/checkout@v6

      # Root toolchain (no `rust-src-dir`): this workspace pins nothing of
      # its own. `cache-workspaces` still has to be spelled out, since it
      # otherwise defaults to `rust-src-dir`, which is unset here.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache-workspaces: crates/fofoca-netplay/examples/light-cycles/web/wasm

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Native (rlib) target: the crate's own unit tests (grid/round/sim/wire
      # logic, ported from — and kept wire-compatible with — native/game's
      # copy) run here since proptest and wasm32 don't mix.
      - name: Test
        run: cargo test

      # `--no-default-features`: the portable half only — see wasm/Cargo.toml's
      # own comment on why. This is the engine actually reaching the browser,
      # not merely being avoidable from it.
      - name: Check (wasm32)
        run: cargo check --target wasm32-unknown-unknown --no-default-features

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features -- -D warnings

      # `wasm-bindgen-cli`'s version must match the `wasm-bindgen` crate
      # version resolved into wasm/Cargo.lock, or the glue it emits and the
      # binary it emits it for disagree at load time. Read out of the
      # lockfile rather than written down again here, so the two cannot
      # drift apart silently.
      - name: Install wasm-bindgen-cli
        run: |
          version=$(cargo pkgid wasm-bindgen | sed 's/.*[@#]//')
          echo "wasm-bindgen resolved to $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build wasm
        working-directory: crates/fofoca-netplay/examples/light-cycles/web
        run: ./build-wasm.sh

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: crates/fofoca-netplay/examples/light-cycles/web
        run: bun install --frozen-lockfile

      # Covers the app's own tsconfig.json plus every vendored package's
      # (visage-dom/visage-canvas/visage-style) — see package.json's
      # `typecheck` script. Needs the real wasm build above: `wasm.ts`
      # imports the wasm-bindgen glue's generated types.
      - name: Typecheck
        working-directory: crates/fofoca-netplay/examples/light-cycles/web
        run: bun run typecheck
